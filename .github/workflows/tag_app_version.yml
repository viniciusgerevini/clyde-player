name: "tag app version"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]

jobs:
  tag-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_TOKEN }}

      - name: Tag version
        run: ./build_scripts/tag_by_tauri_config_version
        env:
          GIT_USER_NAME: "Github Actions"
          GIT_USER_EMAIL: "actions@github.com"
